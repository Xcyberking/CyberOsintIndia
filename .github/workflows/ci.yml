name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Do not enable setup-node's npm cache until package-lock.json is committed.
          # The repository currently uses npm install without a lockfile.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build
